name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/demoningvi/proview-web
  CHART: charts/proview-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: SDK unit tests
        run: npm test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run read-only, non-root
        run: |
          docker build -t web:ci .
          docker run -d --name web --user 65532:65532 --read-only \
            --tmpfs /tmp:uid=65532,gid=65532 --tmpfs /etc/nginx/conf.d:uid=65532,gid=65532 \
            -e BANNER_ENDPOINT=https://ads.example.com -p 8080:8080 -p 9090:9090 web:ci
          sleep 3
          curl -fsS localhost:9090/healthz
          curl -fsS localhost:8080/config.js | grep -q 'https://ads.example.com'
          curl -fsS -o /dev/null localhost:8080/sdk/proview.js
          curl -fsS -o /dev/null localhost:8080/banners/aurora-728x90.svg

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint ${{ env.CHART }} --strict
      - name: Validate rendered manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template t ${{ env.CHART }} --set ingress.enabled=true --set serviceMonitor.enabled=true \
            | ./kubeconform -strict -ignore-missing-schemas -summary

  image:
    needs: [test, smoke, helm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  chart:
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Package and push chart to GHCR (OCI)
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package ${{ env.CHART }} --version "$V" --app-version "$V"
          helm push proview-web-"$V".tgz oci://ghcr.io/demoningvi/charts
